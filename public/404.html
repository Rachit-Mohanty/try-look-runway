<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>404 — Nike Runway</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      background: #ffffff;
      color: #151413;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      width: min(760px, 100%);
      border-top: 1px solid #151413;
      border-bottom: 1px solid #d9d9d9;
      padding: clamp(28px, 5vw, 48px) 0;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #66625c;
      margin: 0 0 22px;
    }
    .hero {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: clamp(20px, 4vw, 44px);
      align-items: end;
      margin-bottom: 30px;
    }
    .code {
      font-size: clamp(72px, 15vw, 152px);
      font-weight: 400;
      line-height: 0.88;
      letter-spacing: -0.045em;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 3.2vw, 34px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    p.sub {
      margin: 0;
      font-size: 14px;
      line-height: 1.55;
      color: #66625c;
      max-width: 50ch;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid #151413;
    }
    a.btn--primary { background: #151413; color: #ffffff; }
    a.btn--secondary { background: #ffffff; color: #151413; }
    @media (max-width: 640px) {
      .hero { grid-template-columns: 1fr; gap: 14px; }
      a.btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Error 404 · Page Not Found</p>
    <div class="hero">
      <div class="code" aria-hidden="true">404</div>
      <div>
        <h1>This piece or runway room could not be found.</h1>
        <p class="sub">The requested link is unavailable or moved off the runway floor. Return to the main gallery or launch the interactive Runway.</p>
      </div>
    </div>
    <div class="actions">
      <a class="btn btn--primary" href="/#home">Return to Home →</a>
      <a class="btn btn--secondary" href="/#runway">Enter the Runway →</a>
    </div>
  </main>
</body>
</html>
